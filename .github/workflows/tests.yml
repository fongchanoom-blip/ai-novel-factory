name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml gradio

      - name: Validate metadata
        run: |
          python scripts/metadata_validator.py .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml gradio

      - name: Test scripts
        run: |
          # 测试所有 scripts 语法 + --help
          for script in scripts/*.py; do
            python -m py_compile "$script" || exit 1
            python "$script" --help || true
          done

      - name: Test web app
        run: |
          cd web
          python -m py_compile app.py
          python -c "import app; print('✅ Web app imports OK')"

      - name: Test genre templates
        run: |
          python -c "
          import os
          genre_dir = 'kb-templates/genre'
          for f in os.listdir(genre_dir):
              if f.endswith('.md'):
                  print(f'✅ {f}')
          "

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/